name: 每日A股复盘矩阵

on:
  schedule:
    # UTC 08:30 = 北京时间 16:30（A股 15:00 收盘后），周一至周五
    - cron: '30 8 * * 1-5'
  workflow_dispatch:        # 支持手动触发
    inputs:
      date:
        description: '指定日期 YYYYMMDD（留空为今日）'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: daily-report
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 抓取行情数据（8 个报告，单源失败不中断）
        id: fetch
        run: |
          set +e
          python scripts/fetch_data.py   || echo "⚠️ fetch_data 失败，沿用旧数据"
          python scripts/flow_fetch.py   || echo "⚠️ flow_fetch 失败"
          python scripts/lhb_fetch.py    || echo "⚠️ lhb_fetch 失败"
          python scripts/global_fetch.py || echo "⚠️ global_fetch 失败"
          python scripts/val_fetch.py    || echo "⚠️ val_fetch 失败"
          python scripts/ipo_fetch.py    || echo "⚠️ ipo_fetch 失败"
          python scripts/bond_fetch.py   || echo "⚠️ bond_fetch 失败"
          python scripts/fund_fetch.py   || echo "⚠️ fund_fetch 失败"
          set -e

      - name: 生成报告页面（8 个）
        run: |
          python scripts/render_report.py
          python scripts/flow_render.py
          python scripts/lhb_render.py
          python scripts/global_render.py
          python scripts/val_render.py
          python scripts/ipo_render.py
          python scripts/bond_render.py
          python scripts/fund_render.py

      - name: 校验产出
        run: |
          for f in sentiment.html fundflow.html lhb.html global.html valuation.html ipo.html bond.html fund.html; do
            test -f "$f" || { echo "$f 未生成"; exit 1; }
            size=$(stat -c%s "$f")
            echo "$f 大小: $size 字节"
            if [ "$size" -lt 10000 ]; then
              echo "$f 过小，疑似生成异常"
              exit 1
            fi
          done

      - name: 数据新鲜度自检
        id: check
        continue-on-error: true
        run: |
          python - <<'PY'
          import json, datetime
          tz = datetime.timezone(datetime.timedelta(hours=8))
          today = datetime.datetime.now(tz).strftime('%Y-%m-%d')
          files = {
            'data.json':'情绪','data_flow.json':'资金流','data_lhb.json':'龙虎榜',
            'data_global.json':'大类资产','data_val.json':'估值','data_ipo.json':'次新',
            'data_bond.json':'转债','data_fund.json':'基金'
          }
          stale=[]
          for f,label in files.items():
            try:
              d=json.load(open(f,encoding='utf-8'))
              gen=d.get('generated','') or d.get('date','')
              ok = today in str(gen)
              print(f"{label:6} {f:18} generated={gen} -> {'OK' if ok else 'STALE'}")
              if not ok: stale.append(label)
            except Exception as e:
              print(f"{label:6} {f:18} 读取失败: {e}")
              stale.append(label)
          if stale:
            print("⚠️ 以下看板数据非今日（可能为旧数据）:", ','.join(stale))
          else:
            print("✅ 全部 8 个看板数据均为今日")
          PY

      - name: 提交更新
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sentiment.html fundflow.html lhb.html global.html valuation.html ipo.html bond.html fund.html index.html \
                  data.json data_flow.json data_lhb.json data_global.json data_val.json data_ipo.json data_bond.json data_fund.json
          if git diff --staged --quiet; then
            echo "内容无变化，跳过提交"
          else
            git commit -m "复盘矩阵更新 $(TZ=Asia/Shanghai date +%Y-%m-%d)"
            git push
          fi
