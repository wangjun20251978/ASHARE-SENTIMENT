name: 每日A股主线情绪复盘

on:
  schedule:
    # UTC 08:30 = 北京时间 16:30（A股 15:00 收盘后），周一至周五
    - cron: '30 8 * * 1-5'
  workflow_dispatch:        # 支持手动触发
    inputs:
      date:
        description: '指定日期 YYYYMMDD（留空为今日）'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: daily-report
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 抓取行情数据
        id: fetch
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            python scripts/fetch_data.py --date "${{ github.event.inputs.date }}"
          else
            python scripts/fetch_data.py
          fi

      - name: 生成报告页面
        run: python scripts/render_report.py

      - name: 校验产出
        run: |
          test -f index.html || { echo "index.html 未生成"; exit 1; }
          size=$(stat -c%s index.html)
          echo "index.html 大小: $size 字节"
          if [ "$size" -lt 15000 ]; then
            echo "index.html 过小，疑似生成异常"
            exit 1
          fi

      - name: 提交更新
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html data.json
          if git diff --staged --quiet; then
            echo "内容无变化，跳过提交"
          else
            git commit -m "复盘更新 $(TZ=Asia/Shanghai date +%Y-%m-%d)"
            git push
          fi
