name: 每日A股复盘矩阵

on:
  schedule:
    # UTC 08:30 = 北京时间 16:30（A股 15:00 收盘后），周一至周五
    - cron: '30 8 * * 1-5'
  workflow_dispatch:        # 支持手动触发
    inputs:
      date:
        description: '指定日期 YYYYMMDD（留空为今日）'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: daily-report
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 抓取行情数据（8 个报告）
        id: fetch
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            python scripts/fetch_data.py --date "${{ github.event.inputs.date }}"
          else
            python scripts/fetch_data.py
          fi
          python scripts/flow_fetch.py     # 资金榜
          python scripts/lhb_fetch.py      # 龙虎榜（数据源不稳，失败则空态）
          python scripts/global_fetch.py   # 大类资产
          python scripts/val_fetch.py      # 估值分位
          python scripts/ipo_fetch.py      # 新股/次新
          python scripts/bond_fetch.py     # 转债
          python scripts/fund_fetch.py     # 基金

      - name: 生成报告页面（8 个）
        run: |
          python scripts/render_report.py
          python scripts/flow_render.py
          python scripts/lhb_render.py
          python scripts/global_render.py
          python scripts/val_render.py
          python scripts/ipo_render.py
          python scripts/bond_render.py
          python scripts/fund_render.py

      - name: 校验产出
        run: |
          for f in index.html fundflow.html lhb.html global.html valuation.html ipo.html bond.html fund.html; do
            test -f "$f" || { echo "$f 未生成"; exit 1; }
            size=$(stat -c%s "$f")
            echo "$f 大小: $size 字节"
            if [ "$size" -lt 10000 ]; then
              echo "$f 过小，疑似生成异常"
              exit 1
            fi
          done

      - name: 提交更新
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html fundflow.html lhb.html global.html valuation.html ipo.html bond.html fund.html hub.html \
                  data.json data_flow.json data_lhb.json data_global.json data_val.json data_ipo.json data_bond.json data_fund.json
          if git diff --staged --quiet; then
            echo "内容无变化，跳过提交"
          else
            git commit -m "复盘矩阵更新 $(TZ=Asia/Shanghai date +%Y-%m-%d)"
            git push
          fi
